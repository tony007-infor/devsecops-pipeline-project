name: DevSecOps CI Pipeline Completo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Construcción y Análisis Integral
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Análisis Estático (SAST) - Exporta en formato SARIF
      - name: Análisis Estático (SAST) con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1" # Esto genera un archivo semgrep.sarif
        continue-on-error: true

      # 2. Construcción de Imagen
      - name: Construir imagen Docker
        run: docker build -t mi-app-vulnerable:latest .

      # 3. Escaneo de Contenedor - Exporta en formato JSON
      - name: Escaneo de Contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-vulnerable:latest'
          format: 'json'
          output: 'trivy-results.json' # Guarda los resultados en este archivo
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue Efímero
      - name: Levantar aplicación en entorno de pruebas
        run: |
          docker run -d -p 8080:80 --name app-seguridad mi-app-vulnerable:latest
          sleep 10 

      # 5. Análisis Dinámico (DAST) - Exporta en formato JSON
      # Usamos --network host para que ZAP pueda ver el puerto 8080 y -v para guardar el reporte
      - name: Análisis Dinámico (DAST) con OWASP ZAP
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --network host -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8080 -J zap-results.json || true

      # 6. Recopilar y guardar los reportes generados
      - name: Subir Reportes para DefectDojo
        uses: actions/upload-artifact@v4
        with:
          name: reportes-seguridad
          path: |
            semgrep.sarif
            trivy-results.json
            zap-results.json