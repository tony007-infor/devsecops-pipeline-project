name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Construcción y Análisis de Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Análisis Estático (SAST) con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
        continue-on-error: true

      - name: Construir imagen Docker
        run: docker build -t mi-app-vulnerable:latest .

      # PASO 5: Escaneo de vulnerabilidades en la imagen Docker con Trivy
      - name: Escaneo de Contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-vulnerable:latest'
          format: 'table'
          # Se mantiene exit-code 0 para que el pipeline no se rompa y muestre la tabla completa
          exit-code: '0'
          severity: 'CRITICAL,HIGH'