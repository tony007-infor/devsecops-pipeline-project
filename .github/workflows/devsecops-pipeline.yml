name: DevSecOps CI Pipeline Completo

on:
  push:
    branches:
      - main

# NUEVO: Otorgar permisos para que OWASP ZAP pueda escribir el reporte en la pestaña "Issues"
permissions:
  issues: write
  contents: read

jobs:
  build-and-test:
    name: Construcción y Análisis Integral
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. Análisis Estático (SAST)
      - name: Análisis Estático (SAST) con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
        continue-on-error: true

      # 2. Construcción de Imagen
      - name: Construir imagen Docker
        run: docker build -t mi-app-vulnerable:latest .

      # 3. Escaneo de Contenedor
      - name: Escaneo de Contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-vulnerable:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue Efímero
      - name: Levantar aplicación en entorno de pruebas
        run: |
          docker run -d -p 8080:80 --name app-seguridad mi-app-vulnerable:latest
          sleep 10 

      # 5. Análisis Dinámico (DAST)
  # 5. Análisis Dinámico (DAST)
      - name: Análisis Dinámico (DAST) con OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          fail_action: false 
        continue-on-error: true # Ignorará el fallo al guardar el artefacto