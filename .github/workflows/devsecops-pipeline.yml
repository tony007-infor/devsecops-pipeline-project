name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Construcción y Análisis de Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # PASO 4: Análisis Estático de Código (SAST) con Semgrep
      - name: Análisis Estático (SAST) con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
        # Permite que el pipeline continúe aunque encuentre errores de seguridad, útil para fines académicos
        continue-on-error: true

      - name: Construir imagen Docker
        run: docker build -t mi-app-vulnerable:latest .